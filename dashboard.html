<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — riots.wtf</title>
  <link rel="icon" href="gui.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page dash">
  <!-- ===== NAVBAR ===== -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><img src="gui.png" alt="riots.wtf" /></a>
      <nav class="nav-tabs">
        <a href="index.html" class="tab"><i data-lucide="house"></i><span>Home</span></a>
        <a href="products.html" class="tab"><i data-lucide="shopping-bag"></i><span>Products</span></a>
        <a href="status.html" class="tab"><i data-lucide="activity"></i><span>Status</span></a>
        <a href="referral.html" class="tab"><i data-lucide="gift"></i><span>Referral</span></a>
      </nav>
      <div class="nav-right">
        <a href="https://discord.gg/m7Z9Jyp6pf" target="_blank" rel="noopener" class="nav-icon-btn" aria-label="Discord" title="Discord"><svg class="brand" viewBox="0 0 127.14 96.36" fill="currentColor"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg></a>
        <a href="dashboard.html" class="nav-btn solid"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      </div>
    </div>
  </header>

  <!-- ===== DASHBOARD CONTENT (blurred until authed) ===== -->
  <main class="dash-main" id="dashMain">
    <div class="dash-wrap" id="dashContent">
      <section class="page-hero" style="padding-top:130px;padding-bottom:10px">
        <div class="page-hero-inner">
          <span class="eyebrow">Account</span>
          <h1 class="page-title">Your <span class="grad">dashboard.</span></h1>
        </div>
      </section>

      <div class="dash-body">
        <!-- Tabs -->
        <div class="dash-tabs" id="dashTabs">
          <button class="dtab active" data-view="profile"><i data-lucide="user-round"></i> Profile</button>
          <button class="dtab" data-view="keys"><i data-lucide="key-round"></i> My Keys</button>
          <button class="dtab" data-view="updates"><i data-lucide="megaphone"></i> Updates</button>
          <button class="dtab" data-view="status"><i data-lucide="activity"></i> Status</button>
          <button class="dtab admin-only" data-view="admin" hidden><i data-lucide="shield"></i> Admin</button>
          <button class="dtab logout" id="logoutBtn"><i data-lucide="log-out"></i> Logout</button>
        </div>

        <!-- PROFILE VIEW -->
        <section class="dview" data-view="profile">
          <div id="profileArea"></div>
        </section>

        <!-- KEYS VIEW -->
        <section class="dview" data-view="keys" hidden>
          <div class="dash-user" id="dashUser"></div>
          <div id="keysArea"></div>
        </section>

        <!-- UPDATES VIEW -->
        <section class="dview" data-view="updates" hidden>
          <div id="updatesArea" class="updates-feed"><div class="dash-loading"><span></span><span></span><span></span></div></div>
        </section>

        <!-- STATUS VIEW -->
        <section class="dview" data-view="status" hidden>
          <div id="statusArea"></div>
        </section>

        <!-- ADMIN VIEW -->
        <section class="dview admin-only" data-view="admin" hidden>
          <div id="adminArea"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- ===== AUTH OVERLAY (blur gate) ===== -->
  <div class="auth-gate" id="authGate">
    <div class="ag-bg"><span class="orb o1"></span><span class="orb o2"></span></div>
    <div class="ag-card" id="agCard">
      <img src="gui.png" alt="riots.wtf" class="ag-logo" />
      <h2 id="agTitle">Authenticate your account</h2>
      <p id="agSub">Register your key to access your dashboard.</p>

      <!-- Step 1: start -->
      <div id="agStepStart">
        <button class="btn btn-gradient wide" id="agRegisterBtn">
          <i data-lucide="key-round"></i>
          <span>I need to register my key</span>
        </button>
        <button class="ag-admin-toggle" id="agAdminToggle">Admin sign-in</button>
      </div>

      <!-- Step 2: enter key -->
      <div id="agStepKey" hidden>
        <p class="ag-note">Enter your license key to continue.</p>
        <input type="text" id="agKeyInput" placeholder="Enter your license key" />
        <button class="btn btn-gradient wide" id="agKeyContinue"><span>Continue</span></button>
        <button class="ag-admin-toggle" id="agKeyBack">Back</button>
        <p class="ag-error" id="agKeyError" hidden></p>
      </div>

      <!-- Admin key entry -->
      <div id="agStepAdmin" hidden>
        <input type="password" id="agAdminInput" placeholder="Enter admin key" />
        <button class="btn btn-gradient wide" id="agAdminSubmit"><span>Unlock admin</span></button>
        <button class="ag-admin-toggle" id="agAdminBack">Back</button>
        <p class="ag-error" id="agAdminError" hidden></p>
      </div>
    </div>
  </div>

  <!-- ===== DISCORD-LINK OVERLAY (dashboard visible but blurred behind it) ===== -->
  <div class="link-gate" id="linkGate" hidden>
    <div class="lg-card reveal-in">
      <img src="gui.png" alt="riots.wtf" class="ag-logo" />
      <h2>One more step</h2>
      <p>Link this key to your Discord to finish and save your access.</p>
      <button class="btn btn-gradient wide" id="authDiscordBtn">
        <svg class="brand" viewBox="0 0 127.14 96.36" fill="currentColor"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
        <span>Auth my Discord</span>
      </button>
      <p class="ag-error" id="linkError" hidden></p>
      <button class="ag-admin-toggle" id="linkCancel">Use a different key</button>
    </div>
  </div>

  <!-- Public config (API base, client token). Edit config.js, not here. -->
  <script src="config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="dashboard.js" defer></script>
</body>
</html>
